name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ qt6-base-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Slice the demo models
        run: |
          ./build/gen_models models
          ./build/slicer_cli models/torus_knot.stl --quiet
          ./build/slicer_cli models/torus_knot.stl --bench --layer-height 0.1 --repeat 3

      - name: Upload viewer screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-smoke
          path: build/viewer_smoke.png
          if-no-files-found: ignore
